services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: eha_q1_postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eha_q1}
      POSTGRES_USER: ${POSTGRES_USER:-eha_q1_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/schema.sql:/opt/eha_q1/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
